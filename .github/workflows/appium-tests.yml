name: Appium Android Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      working-directory: ./appium-tests
      run: npm install
      
    - name: Run WebdriverIO Tests (Mock Mode)
      working-directory: ./appium-tests
      run: npm test || true
      env:
        CI: true
        
    - name: Upload Appium Test Report
      uses: actions/upload-artifact@v3
      with:
        name: appium-android-report
        path: reports/appium/
